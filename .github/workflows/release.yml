name: Build Aurora R36 ARM releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create (for example v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3

      - name: Restore executable permissions and run package checks
        run: chmod 755 ./*.sh tests/*.sh

      - name: Compile and package inside matching Debian ARM userspace
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          docker run --rm --platform "$TARGET_PLATFORM" \
            -e TARGET_ARCH="$TARGET_ARCH" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            debian:bullseye-slim \
            sh -euxc '
              # Bullseye is retained as a conservative glibc/SDL2 build base.
              # It reached Debian LTS EOL in Aug 2026 and is now in the archive.
              sed -i \
                -e "s#deb.debian.org/debian#archive.debian.org/debian#g" \
                -e "/security.debian.org/d" \
                -e "/bullseye-updates/d" \
                /etc/apt/sources.list
              echo "Acquire::Check-Valid-Until false;" > /etc/apt/apt.conf.d/99no-check-valid-until
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential libsdl2-dev pkg-config zip ca-certificates
              chmod 755 ./*.sh tests/*.sh
              sh tests/test_package.sh
              make clean all
              ./build/aurora --version
              sh package-release.sh "$TARGET_ARCH"
              cp "Aurora_R36_${TARGET_ARCH}.zip" build-output/
            '

      - name: Verify Ports archive layout and file modes
        run: |
          unzip -l "build-output/Aurora_R36_${{ matrix.arch }}.zip"
          python3 - <<'PY'
          import stat, zipfile, os
          import sys
          archive = "build-output/Aurora_R36_${{ matrix.arch }}.zip"
          required = [
              "ports/Aurora.sh",
              "ports/Install Aurora.sh",
              "ports/Aurora-R36/aurora",
              "ports/Aurora-R36/Aurora.sh",
              "ports/Aurora-R36/install.sh",
              "ports/Aurora-R36/update.sh",
              "ports/Aurora-R36/github_repo.txt",
          ]
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              missing = [p for p in required if p not in names]
              if missing:
                  raise SystemExit("Missing paths: " + ", ".join(missing))
              for p in required:
                  info = z.getinfo(p)
                  mode = (info.external_attr >> 16) & 0o777
                  if p.endswith(".sh") or p.endswith("/aurora"):
                      if mode & 0o111 == 0:
                          raise SystemExit(f"Not executable in ZIP: {p} mode={oct(mode)}")
          print("Ports archive layout and executable modes verified.")
          PY

      - name: Upload architecture package
        uses: actions/upload-artifact@v4
        with:
          name: Aurora_R36_${{ matrix.arch }}
          path: build-output/Aurora_R36_${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Download ARM packages
        uses: actions/download-artifact@v4
        with:
          pattern: Aurora_R36_*
          merge-multiple: true
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Aurora R36 ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/Aurora_R36_armv7.zip
            release-assets/Aurora_R36_aarch64.zip
